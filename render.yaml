services:
  - type: web
    name: pesquisavoos
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: AMADEUS_CLIENT_ID
        sync: false
      - key: AMADEUS_CLIENT_SECRET
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: SEARCH_HOUR
        value: "6"
      - key: DB_PATH
        value: "/opt/render/project/src/flights.db"
